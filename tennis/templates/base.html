<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Your CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <title>{% block title %}Tennis Prediction{% endblock %}</title>
</head>
<body class="bg-light" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' style="font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">

    <!-- Loading indicator for HTMX -->
    <div class="htmx-indicator position-fixed top-0 start-50 translate-middle-x mt-3 z-3" id="loading-indicator" aria-live="polite">
        <div class="spinner-border spinner-border-sm text-primary me-2" role="status" aria-hidden="true"></div>
        <span class="text-primary fw-semibold">Loading…</span>
    </div>

    <header class="border-bottom bg-white">
        <nav class="navbar navbar-expand-lg container py-2">
            <a class="navbar-brand fw-bold text-primary" href="{% url 'tennis:home' %}">TennisPredict</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="navMain" class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active fw-semibold{% endif %}" href="{% url 'tennis:home' %}">Home</a>
                    </li>
                    <!-- Keep these pointed at home for now since you don’t have views yet -->
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Contact</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-top bg-white">
        <div class="container py-3 text-center text-muted small">
            &copy; {{ now|date:"Y" }} Tennis Prediction. All rights reserved.
        </div>
    </footer>

    <!-- Bootstrap JS (Popper included) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Your JS -->
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
