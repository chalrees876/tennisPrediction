<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>


    <!-- Your CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <title>{% block title %}Tennis Prediction{% endblock %}</title>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <!-- HTMX Loading Indicator -->
    <div class="htmx-indicator" id="loading-indicator">
        <div class="spinner">Loading...</div>
    </div>

    <header class="site-header">
        <nav class="navbar">
            <div class="nav-brand">
                <a href="{% url 'tennis:home' %}">TennisPredict</a>
            </div>
            <ul class="nav-links">
                <li><a href="{% url 'tennis:home' %}"
                       {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>
                    Home
                </a></li>
                <li><a href="{% url 'tennis:home' %}"
                       {% if request.resolver_match.url_name == 'about' %}class="active"{% endif %}>
                    About
                </a></li>
                <li><a href="{% url 'tennis:home' %}"
                       {% if request.resolver_match.url_name == 'contact' %}class="active"{% endif %}>
                    Contact
                </a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2024 Tennis Prediction. All rights reserved.</p>
    </footer>

    <!-- Your custom JavaScript -->
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
