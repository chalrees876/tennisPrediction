{% extends 'base.html' %}
{% block title %} H2H - Tennis Predictions{% endblock %}
{% block content %}
<div class="container">
    <div class="row">
        <h2>Player</h2>
        <span>Wins: {{ player_wins }}</span>
    </div>
    {% for m in h2h_matches %}
    <h1>{{ m }}</h1>
    <h1>{{ m.score }}</h1>
    <h1>{{ m.won }}</h1>
    {% endfor %}

</div>
{% endblock %}
